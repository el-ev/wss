    function isNearScreenBottom() {
        return screenEl.scrollHeight - screenEl.clientHeight - screenEl.scrollTop <= followSlackPx;
    }

    function scrollScreenToBottom() {
        screenEl.scrollTop = screenEl.scrollHeight;
    }

    screenEl.addEventListener(
        "scroll",
        () => {
            followScreenBottom = isNearScreenBottom();
        },
        { passive: true }
    );

    function readIntStyle(style, name, fallback = 0) {
        const parsed = Number.parseInt(style.getPropertyValue(name), 10);
        if (Number.isNaN(parsed)) return fallback;
        return parsed;
    }

    function formatSpeedLabel(value) {
        if (value < 0.1) return `${value.toFixed(3)}x`;
        if (value < 1) return `${value.toFixed(2)}x`;
        const rounded = Math.round(value * 100) / 100;
        return `${rounded.toFixed(rounded % 1 === 0 ? 0 : 2)}x`;
    }

    function readPc(style) {
        return readIntStyle(style, "--pc", readIntStyle(style, "--_1pc", 0));
    }

    function refreshDebuggerLabels(style) {
        if (!debugStateOut) return;
        const pc = readPc(style);
        debugStateOut.textContent = halted ? "halted" : paused ? "paused" : "running";
        debugPcOut.textContent = Number.isNaN(pc) ? "?" : String(pc);
        debugClockOut.textContent = String(clock);
        if (debugRunBtn) {
            debugRunBtn.textContent = paused ? "Run" : "Pause";
        }
        if (debugStepBtn) {
            debugStepBtn.disabled = halted || !paused;
        }
        if (debugSpeedOut) {
            debugSpeedOut.textContent = formatSpeedLabel(speedMultiplier);
        }
        renderDebuggerOps(pc, style);
        refreshDebuggerRng(style);
    }

    function refreshDebuggerRng(style) {
        if (!debugRngFreeze) return;
        const live = [0, 1, 2, 3].map((i) => {
            const v = Number.parseInt(style.getPropertyValue("--rng" + i), 10);
            return Number.isNaN(v) ? 0 : v & 0xff;
        });
        if (!debugRngFreeze.checked) {
            for (let i = 0; i < 4; i++) {
                debugRngSliders[i].value = String(live[i]);
                debugRngVals[i].textContent = String(live[i]);
            }
        }
        const r = debugRngFreeze.checked
            ? debugRngSliders.map((s) => Number.parseInt(s.value, 10) & 0xff)
            : live;
        const mix = (lane) =>
            (r[lane] * r[(lane + 1) & 3] + r[(lane + 2) & 3] + 1) & 0xff;
        const u32 = (mix(0) | (mix(1) << 8) | (mix(2) << 16) | (mix(3) << 24)) >>> 0;
        debugRngU32.textContent = "0x" + u32.toString(16).padStart(8, "0");
    }

    function applyRngFreezeOverride() {
        for (let i = 0; i < 4; i++) {
            document.body.style.setProperty(
                "--rng" + i,
                debugRngSliders[i].value,
                "important"
            );
        }
    }
    function clearRngFreezeOverride() {
        document.body.style.removeProperty("--rng0");
        document.body.style.removeProperty("--rng1");
        document.body.style.removeProperty("--rng2");
        document.body.style.removeProperty("--rng3");
    }

    function setStickyKey(code) {
        debugStickyKey = code;
        if (code == null) {
            clkEl.style.removeProperty("--kb");
        } else {
            clkEl.style.setProperty("--kb", String(code), "important");
        }
        if (debugStickyKeyOut) {
            debugStickyKeyOut.textContent =
                code == null
                    ? "none"
                    : `${code} (${code >= 0x20 && code < 0x7f ? `'${String.fromCharCode(code)}'` : "ctrl"})`;
        }
    }

    const KB_SHIFT_MAP = {
        96: 126, 49: 33, 50: 64, 51: 35, 52: 36, 53: 37, 54: 94, 55: 38,
        56: 42, 57: 40, 48: 41, 45: 95, 61: 43, 91: 123, 93: 125, 92: 124,
        59: 58, 39: 34, 44: 60, 46: 62, 47: 63,
    };
    function decodeVirtualKey(dataKey, shifted) {
        if (!shifted) return dataKey;
        if (dataKey >= 97 && dataKey <= 122) return dataKey - 32;
        return KB_SHIFT_MAP[dataKey] != null ? KB_SHIFT_MAP[dataKey] : dataKey;
    }

    function annotateRegs(line, style) {
        return line.replace(/%r(\d+)/g, (_, n) => {
            const v = Number.parseInt(style.getPropertyValue(`--r${n}`), 10);
            const hex = Number.isFinite(v) ? (v & 0xff).toString(16).padStart(2, "0") : "??";
            return `%r${n}(0x${hex})`;
        });
    }

    function renderDebuggerOps(pc, style) {
        if (!debugOpsList) return;
        const key = Number.isNaN(pc) ? null : String(pc);
        if (debugOpsHead) {
            debugOpsHead.textContent = key != null ? `PC ${key}` : "PC ?";
        }
        const ops = key != null ? debuggerCycles[key] : null;
        debugOpsList.textContent = "";
        if (!ops || ops.length === 0) {
            const li = document.createElement("li");
            li.className = "empty";
            li.textContent = "(no operations)";
            debugOpsList.appendChild(li);
            return;
        }
        for (let i = 0; i < ops.length; i++) {
            const li = document.createElement("li");
            if (i === ops.length - 1) li.className = "term";
            li.textContent = annotateRegs(ops[i], style);
            debugOpsList.appendChild(li);
        }
    }

    function scheduleAnimation() {
        if (animationPending || halted) return;
        animationPending = true;
        requestAnimationFrame(animate);
    }


    function tickSingleInstruction() {
        for (let i = 0; i < phasesPerInstruction; i++) {
            const phase = clock;
            clkEl.style.setProperty("--clk", String(phase), "important");
            clock = (clock + 1) & 3;
            getComputedStyle(terminalEl).getPropertyValue("--_1pc");
        }
    }

    function runInstructionBatch(instructionCount) {
        let style = getComputedStyle(terminalEl);
        let pc = readPc(style);
        for (let i = 0; i < instructionCount; i++) {
            tickSingleInstruction();
            style = getComputedStyle(terminalEl);
            pc = readPc(style);
            if (!Number.isNaN(pc) && terminalPcs.has(pc)) {
                return { style, pc, halted: true };
            }
        }
        return { style, pc, halted: !Number.isNaN(pc) && terminalPcs.has(pc) };
    }

    function animate() {
        animationPending = false;
        if (halted) return;

        let instructionsThisFrame = 0;
        if (pendingStepCount > 0) {
            instructionsThisFrame = pendingStepCount;
            pendingStepCount = 0;
            paused = true;
        } else if (!paused) {
            speedCarry += speedMultiplier;
            instructionsThisFrame = Math.floor(speedCarry);
            speedCarry -= instructionsThisFrame;
        }

        let style = getComputedStyle(terminalEl);
        let pc = readPc(style);
        if (instructionsThisFrame > 0) {
            const batch = runInstructionBatch(instructionsThisFrame);
            style = batch.style;
            pc = batch.pc;
            halted = batch.halted;
            // Sticky key is consumed once per step batch so the next batch
            // doesn't accidentally re-deliver the same character.
            if (debugStickyKey != null) setStickyKey(null);
        }

        if (followScreenBottom) {
            scrollScreenToBottom();
        }
        if (!Number.isNaN(pc) && terminalPcs.has(pc)) {
            halted = true;
        }
        if (halted) {
            paused = true;
        }
        refreshDebuggerLabels(style);
        if (!halted && (!paused || pendingStepCount > 0)) {
            scheduleAnimation();
        }
    }

    function clampSpeed(value) {
        if (!Number.isFinite(value)) return 1;
        return Math.min(maxSpeedMultiplier, Math.max(minSpeedMultiplier, value));
    }

        const closeBtn = popup.querySelector("[data-wss-debug-close='1']");
        const speedInput = popup.querySelector("[data-wss-debug-speed='1']");
        debugSpeedOut = popup.querySelector("[data-wss-debug-speed-value='1']");
        debugRunBtn = popup.querySelector("[data-wss-debug-run='1']");
        debugStepBtn = popup.querySelector("[data-wss-debug-step='1']");
        debugStateOut = popup.querySelector("[data-wss-debug-state='1']");
        debugPcOut = popup.querySelector("[data-wss-debug-pc='1']");
        debugClockOut = popup.querySelector("[data-wss-debug-clock='1']");
        debugOpsList = popup.querySelector("[data-wss-debug-ops='1']");
        debugOpsHead = popup.querySelector("[data-wss-debug-ops-head='1']");
        debugStickyKeyOut = popup.querySelector("[data-wss-debug-sticky-key='1']");
        debugRngFreeze = popup.querySelector("[data-wss-debug-rng-freeze='1']");
        debugRngU32 = popup.querySelector("[data-wss-debug-rng-u32='1']");
        debugRngSliders = [0, 1, 2, 3].map((i) =>
            popup.querySelector("[data-wss-debug-rng-slider='" + i + "']")
        );
        debugRngVals = [0, 1, 2, 3].map((i) =>
            popup.querySelector("[data-wss-debug-rng-val='" + i + "']")
        );
        if (debugRngFreeze) {
            debugRngFreeze.addEventListener("change", () => {
                if (debugRngFreeze.checked) applyRngFreezeOverride();
                else clearRngFreezeOverride();
                refreshDebuggerRng(getComputedStyle(terminalEl));
            });
            debugRngSliders.forEach((slider, i) => {
                slider.addEventListener("input", () => {
                    debugRngVals[i].textContent = slider.value;
                    if (debugRngFreeze.checked) applyRngFreezeOverride();
                    refreshDebuggerRng(getComputedStyle(terminalEl));
                });
            });
        }
        if (!(speedInput instanceof HTMLInputElement) || !closeBtn || !debugRunBtn || !debugStepBtn) {
            return;
        }

        toggleBtn.addEventListener("click", () => {
            popup.hidden = !popup.hidden;
        });
        closeBtn.addEventListener("click", () => {
            popup.hidden = true;
        });
        speedInput.addEventListener("input", () => {
            const logValue = Number.parseFloat(speedInput.value);
            speedMultiplier = clampSpeed(Math.pow(10, logValue));
            if (debugSpeedOut) {
                debugSpeedOut.textContent = formatSpeedLabel(speedMultiplier);
            }
            if (!paused && !halted) {
                scheduleAnimation();
            }
        });
        debugRunBtn.addEventListener("click", () => {
            if (halted) return;
            paused = !paused;
            if (!paused && debugStickyKey != null) setStickyKey(null);
            refreshDebuggerLabels(getComputedStyle(terminalEl));
            if (!paused) {
                scheduleAnimation();
            }
        });
        debugStepBtn.addEventListener("click", () => {
            if (halted) return;
            paused = true;
            pendingStepCount += 1;
            refreshDebuggerLabels(getComputedStyle(terminalEl));
            scheduleAnimation();
        });
        const kbEl = document.querySelector(".kb");
        const shiftToggle = document.getElementById("shift-toggle");
        if (kbEl) {
            kbEl.addEventListener("pointerdown", (event) => {
                if (halted || !paused) return;
                if (!(event.target instanceof Element)) return;
                const keyEl = event.target.closest(".key[data-key]");
                if (!keyEl) return;
                const dataKey = Number.parseInt(keyEl.getAttribute("data-key"), 10);
                if (!Number.isFinite(dataKey)) return;
                const code = decodeVirtualKey(dataKey, !!(shiftToggle && shiftToggle.checked));
                setStickyKey(code);
                event.preventDefault();
            });
        }
    }

    clkEl.style.setProperty("--clk", "0", "important");
    scrollScreenToBottom();
    initializeDebuggerPopup();
    refreshDebuggerLabels(getComputedStyle(terminalEl));
    if (!paused) {
        scheduleAnimation();
    }
})();
</script>
</body>
</html>
